<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <!-- Cyan to Deep Blue Linear Gradient -->
    <linearGradient id="r4t-blue-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Electric Cyan Glow for Root Lightning -->
    <linearGradient id="r4t-root-gradient" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Soft Cyan Glow Filter -->
    <filter id="r4t-cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.6" />
    </filter>
  </defs>

  <g transform="translate(10, 5)">
    <!-- Main Stylized 'R' Upper Body & Right Leg -->
    <path
      d="M 68 20
         H 118
         C 142 20 156 34 156 56
         C 156 76 142 90 120 90
         H 96
         L 146 158
         L 116 158
         L 76 96
         V 158
         H 68
         V 20 Z"
      fill="url(#r4t-blue-gradient)"
    />

    <!-- Inner Cutout of 'R' Loop -->
    <path
      d="M 96 38
         H 116
         C 128 38 136 44 136 56
         C 136 68 128 74 116 74
         H 96
         Z"
      fill="#0F172A"
    />

    <!-- Stylized Sharp Wing on Lower Right Leg -->
    <path
      d="M 120 90
         L 146 158
         L 150 148
         L 134 94
         Z"
      fill="#60A5FA"
      opacity="0.85"
    />

    <!-- Electric Root Tendrils branching downwards and left -->
    <g stroke="url(#r4t-root-gradient)" stroke-linecap="round" stroke-linejoin="round" filter="url(#r4t-cyan-glow)">
      <!-- Main trunk roots -->
      <path d="M 68 85 Q 60 100 62 118 T 58 145 T 62 165" stroke-width="3.5" fill="none" />
      <path d="M 72 95 Q 68 115 72 135 T 70 160" stroke-width="3" fill="none" />
      
      <!-- Primary Left Branches -->
      <path d="M 62 105 Q 45 115 36 128 T 24 142" stroke-width="2.5" fill="none" />
      <path d="M 60 118 Q 48 132 40 148 T 32 162" stroke-width="2" fill="none" />
      <path d="M 62 135 Q 52 148 46 160 T 42 172" stroke-width="1.8" fill="none" />

      <!-- Sub-branches & finer tendrils -->
      <path d="M 45 115 Q 38 122 34 130 T 26 135" stroke-width="1.5" fill="none" />
      <path d="M 36 128 Q 28 136 20 142 T 14 150" stroke-width="1.2" fill="none" />
      <path d="M 48 132 Q 42 140 38 152" stroke-width="1.2" fill="none" />
      <path d="M 58 145 Q 52 155 48 168" stroke-width="1.4" fill="none" />
      
      <!-- Center & Right root branches -->
      <path d="M 66 122 Q 72 135 76 148 T 80 162" stroke-width="2" fill="none" />
      <path d="M 72 135 Q 78 145 84 154" stroke-width="1.4" fill="none" />
      <path d="M 62 148 Q 66 158 68 170" stroke-width="1.5" fill="none" />
      <path d="M 58 160 Q 56 168 54 175" stroke-width="1.2" fill="none" />
    </g>

    <!-- Glowing Root Nodes -->
    <circle cx="24" cy="142" r="1.5" fill="#38BDF8" filter="url(#r4t-cyan-glow)" />
    <circle cx="14" cy="150" r="1.2" fill="#38BDF8" filter="url(#r4t-cyan-glow)" />
    <circle cx="32" cy="162" r="1.5" fill="#38BDF8" filter="url(#r4t-cyan-glow)" />
    <circle cx="42" cy="172" r="1.5" fill="#38BDF8" filter="url(#r4t-cyan-glow)" />
    <circle cx="54" cy="175" r="1.5" fill="#38BDF8" filter="url(#r4t-cyan-glow)" />
    <circle cx="68" cy="170" r="1.5" fill="#38BDF8" filter="url(#r4t-cyan-glow)" />
    <circle cx="80" cy="162" r="1.5" fill="#38BDF8" filter="url(#r4t-cyan-glow)" />

    <!-- Text: ROOT4TECH / ROOTЧTECH -->
    <text
      x="105"
      y="200"
      text-anchor="middle"
      font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
      font-weight="900"
      font-size="21"
      letter-spacing="3.5"
      fill="#FFFFFF"
    >ROOT4TECH</text>
  </g>
</svg>